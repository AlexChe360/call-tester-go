version: '3.8'
services:
  call-tester:
    build: .
    container_name: call-tester
    privileged: true
    network_mode: host
    devices:
      - /dev/ttyUSB0:/dev/ttyUSB0
      - /dev/ttyUSB1:/dev/ttyUSB1
      - /dev/ttyUSB2:/dev/ttyUSB2
      - /dev/ttyUSB3:/dev/ttyUSB3
      - /dev/ttyUSB4:/dev/ttyUSB4
      - /dev/ttyUSB5:/dev/ttyUSB5
      - /dev/ttyUSB6:/dev/ttyUSB6
      - /dev/ttyUSB7:/dev/ttyUSB7
      - /dev/ttyUSB8:/dev/ttyUSB8
      - /dev/ttyUSB9:/dev/ttyUSB9
      - /dev/ttyUSB10:/dev/ttyUSB10
      - /dev/ttyUSB11:/dev/ttyUSB11
      - /dev/ttyUSB12:/dev/ttyUSB12
      - /dev/ttyUSB13:/dev/ttyUSB13
      - /dev/ttyUSB14:/dev/ttyUSB14
      - /dev/ttyUSB15:/dev/ttyUSB15
      - /dev/ttyUSB16:/dev/ttyUSB16
      - /dev/cdc-wdm0:/dev/cdc-wdm0
      - /dev/cdc-wdm1:/dev/cdc-wdm1
    volumes:
      - ./config.yaml:/app/config.yaml:ro
      - ./scenarios:/app/scenarios:ro
      - ./reports:/app/reports
    command: ["run", "scenarios/full_test.yaml"]
